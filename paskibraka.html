<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Paskibraka - MA Al Anbawi</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f7f4;
            color: #174b36;
        }

        header {
            background: #087c51;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            padding: 25px;
            text-align: center;
        }

        .foto-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .foto-grid img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
        }

        .kembali {
            display: inline-block;
            margin: 25px;
            padding: 12px 22px;
            background: #087c51;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .galeri {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
}

.galeri img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 15px;
    display: block;
}

/* Tampilan HP */
@media (max-width: 600px) {
    .galeri {
        grid-template-columns: repeat(2, 1fr);
    }

    .galeri img {
        height: 150px;
    }
}
    </style>
</head>

<body>

<header>
    <h1>Galeri Paskibra</h1>
    <p>Madrasah Aliyah Al Anbawi</p>
</header>

<div class="container">

   <h2>Dokumentasi Kegiatan Paskibraka</h2>

<div class="paskibraka-gallery">

    <div class="galeri">
    <img src="images/paskibraka/paski1.jpg" alt="Kegiatan 1">
    <img src="images/paskibraka/2.jpg" alt="Kegiatan 2">
    <img src="images/paskibraka/3.jpg" alt="Kegiatan 3">
    <img src="images/paskibraka/4.jpg" alt="Kegiatan 4">
    <img src="images/paskibraka/5.jpg" alt="Kegiatan 5">
    <img src="images/paskibraka/6.jpg" alt="Kegiatan 6">
    <img src="images/paskibraka/7.jpg" alt="Kegiatan 7">
    <img src="images/paskibraka/8.jpeg" alt="Kegiatan 8">
    <img src="images/paskibraka/WhatsApp Image 2026-11-18 at 16.26.38.jpeg" alt="Kegiatan 9">

</div>
    <a href="index.html" class="kembali">
        ← Kembali ke Beranda
    </a>

</div>

</body>
</html>
