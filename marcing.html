<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Marching Band - MA Al Anbawi</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f7f4;
            color: #174b36;
        }

        header {
            background: #087c51;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            padding: 25px;
            text-align: center;
        }

        .foto-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .foto-grid img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
        }

        .kembali {
            display: inline-block;
            margin: 25px;
            padding: 12px 22px;
            background: #087c51;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Galeri Marching</h1>
    <p>Madrasah Aliyah Al Anbawi</p>
</header>

<div class="container">

    <h2>Dokumentasi Kegiatan Marching</h2>

<div class="marcing-gallery">

   <div class="galeri">
    <img src="images/marcing/foto1.jpg" alt="Kegiatan 1">
    <img src="images/marcing/foto2.jpg" alt="Kegiatan 2">
    <img src="images/marcing/foto3.jpg"Kegiatan 3">
    <img src="images/marcing/foto4.jpg" alt="Kegiatan 4">
    <img src="images/marcing/hijau.jpg" alt="Kegiatan 5">
    <img src="images/marcing/merah.jpg" alt="Kegiatan 6">
    <img src="images/marcing/merah2.jpg" alt="Kegiatan 7">
    <img src="images/marcing/merah3.jpg" alt="Kegiatan 8">
    <img src="images/marcing/marcing putih.jpg" alt="Kegiatan 9">

</div>
    
    
    <a href="index.html" class="kembali">
        ← Kembali ke Beranda
    </a>

</div>

</body>
</html>
